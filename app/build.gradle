plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abdulrazik.recovery'
    compileSdk 35

    defaultConfig {
        applicationId 'com.abdulrazik.recovery'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file("${rootDir}/abdulrazik-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias "abdulrazik"
            keyPassword System.getenv("KEYSTORE_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
